apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "57.0.3"
    helm:
      values: |
        prometheus:
          prometheusSpec:
            retention: 7d
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            additionalScrapeConfigs:
              - job_name: model-serving
                static_configs:
                  - targets:
                      - model-serving.model-serving.svc.cluster.local:8000
                metrics_path: /metrics
                scrape_interval: 15s
        alertmanager:
          enabled: true
          alertmanagerSpec:
            secrets:
              - alertmanager-slack-secret
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: slack
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 1h
              routes:
                - receiver: slack
                  matchers:
                    - alertname =~ ".*"
            receivers:
              - name: slack
                slack_configs:
                  - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-secret/slack-webhook-url
                    channel: "#mlops-alerts"
                    title: "MLOps Alert"
                    text: "{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
        additionalPrometheusRulesMap:
          mlops-alerts:
            groups:
              - name: model-serving
                rules:
                  - alert: HighLatency
                    expr: histogram_quantile(0.99, churn_prediction_latency_seconds_bucket) > 0.5
                    for: 1m
                    labels:
                      severity: warning
                    annotations:
                      summary: "High latency detected (p99 > 500ms)"
                  - alert: HighChurnRate
                    expr: rate(churn_predictions_total{label="Churn"}[5m]) / rate(churn_predictions_total[5m]) > 0.5
                    for: 2m
                    labels:
                      severity: warning
                    annotations:
                      summary: "High churn rate detected - possible data drift"
                  - alert: ModelServingDown
                    expr: up{job="model-serving"} == 0
                    for: 1m
                    labels:
                      severity: critical
                    annotations:
                      summary: "Model serving is down!"
        grafana:
          adminPassword: "mlops-admin"
          ingress:
            enabled: true
            ingressClassName: nginx
            hosts:
              - grafana.mlops.local
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
        nodeExporter:
          enabled: true
        kubeStateMetrics:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true