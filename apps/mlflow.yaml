apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: "1.8.5"
    helm:
      values: |
        serviceAccount:
          create: false
          name: mlflow

        artifactRoot:
          s3:
            enabled: true
            bucket: mlops-mlflow-artifacts-709598629349
            path: mlflow

        backendStore:
          databaseMigration: true
          postgres:
            enabled: true
            host: "mlflow-db.cj4o8g0uewbo.eu-west-1.rds.amazonaws.com"
            port: 5432
            database: mlflow
            user: mlflow_admin
            password: "z2RhrZFH90A8kyOM"

        extraArgs: {}
        
        extraEnvVars:
          MLFLOW_SERVER_ALLOWED_HOSTS: "*"
          MLFLOW_SERVER_CORS_ALLOWED_ORIGINS: "*"

        service:
          type: ClusterIP
          port: 5000

        ingress:
          enabled: true
          className: nginx
          hosts:
            - host: mlflow.mlops.local
              paths:
                - path: /
                  pathType: Prefix

        resources:
          requests:
            memory: "1Gi"
            cpu: "200m"
          limits:
            memory: "2Gi"
            cpu: "1000m"

  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true