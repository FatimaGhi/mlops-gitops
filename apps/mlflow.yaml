apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mlflow
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://community-charts.github.io/helm-charts
    chart: mlflow
    targetRevision: "0.7.19"
    helm:
      parameters:
        - name: serviceAccount.create
          value: "false"
        - name: serviceAccount.name
          value: "mlflow"
        - name: artifactRoot.s3.enabled
          value: "true"
        - name: artifactRoot.s3.bucket
          value: "mlops-mlflow-artifacts-709598629349"
        - name: artifactRoot.s3.path
          value: "mlflow"
        - name: artifactRoot.s3.awsRegion
          value: "eu-west-1"
        - name: backendStore.databaseMigration
          value: "true"
        - name: backendStore.postgres.enabled
          value: "true"
        - name: backendStore.postgres.host
          value: "mlflow-db.cj4o8g0uewbo.eu-west-1.rds.amazonaws.com"
        - name: backendStore.postgres.port
          value: "5432"
        - name: backendStore.postgres.database
          value: "mlflow"
        - name: backendStore.postgres.user
          value: "mlflow_admin"
        - name: backendStore.postgres.password
          value: "z2RhrZFH90A8kyOM"
        - name: persistence.enabled
          value: "false"
        - name: service.type
          value: "ClusterIP"
        - name: service.port
          value: "5000"
        - name: ingress.enabled
          value: "true"
        - name: ingress.ingressClassName
          value: "nginx"
        - name: ingress.hosts[0].host
          value: "mlflow.mlops.local"
        - name: ingress.hosts[0].paths[0].path
          value: "/"
        - name: ingress.hosts[0].paths[0].pathType
          value: "Prefix"
        - name: resources.requests.memory
          value: "512Mi"
        - name: resources.requests.cpu
          value: "100m"
        - name: resources.limits.memory
          value: "1Gi"
        - name: resources.limits.cpu
          value: "500m"
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - ServerSideApply=true