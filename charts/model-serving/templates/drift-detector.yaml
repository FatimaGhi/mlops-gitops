apiVersion: batch/v1
kind: CronJob
metadata:
  name: drift-detector
  namespace: model-serving
spec:
  schedule: "0 * * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: model-serving
          containers:
            - name: drift-detector
              image: 709598629349.dkr.ecr.eu-west-1.amazonaws.com/model-serving:latest
              command: ["python", "-m", "src.drift_detector"]
              env:
                - name: MLFLOW_TRACKING_URI
                  value: "http://mlflow.mlflow.svc.cluster.local:5000"
                - name: GITHUB_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: github-token
                      key: token
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: alertmanager-slack-secret
                      key: slack-webhook-url
          restartPolicy: Never
      ttlSecondsAfterFinished: 300